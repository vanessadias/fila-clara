services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: queue_demo
      POSTGRES_USER: queue_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-queue_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - queue_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue_user -d queue_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  queue_data:
